name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

# Cancel superseded runs on the same branch — a PR pushed twice should not
# burn CI minutes on the first commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; testing only the newest
        # version is how "requires-python >=3.10" silently becomes a lie.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" -c constraints.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite is offline by design; a test that reaches the network
        # would make CI flaky and is a bug in the test.
        run: pytest -q

      - name: Import check
        run: python -c "import litsearch; print(litsearch.__version__)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Test frontend
        working-directory: web
        run: npm run test
      - name: Build frontend
        working-directory: web
        run: npm run build
