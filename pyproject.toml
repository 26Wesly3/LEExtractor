[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litsearch"
# Must equal litsearch/version.py (asserted by tests/test_release_version.py).
version = "0.9.10"
description = "Literature review toolkit with a Vue/FastAPI workspace, Streamlit GUI and MCP server"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28",
    "streamlit>=1.50,<2",
    "scikit-learn>=1.3",
    "fastmcp>=3.0,<5",
    "python-dotenv>=1.0",
    "networkx>=3.0",
]

[project.scripts]
litsearch-mcp = "litsearch.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27", "tomli>=2; python_version<'3.11'"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "fastembed==0.8.0", "sentencepiece>=0.2,<0.3"]

[tool.setuptools.packages.find]
include = ["litsearch", "litsearch.*"]

[tool.setuptools.package-data]
"litsearch" = ["translation_pins.json", "ccf_catalog.json"]
"litsearch.web" = ["static/**/*", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# `tests/_workspace_tmp` is repo-local test scratch space (and, on this machine,
# an extracted tool binary). It is neither source nor a release artefact.
exclude = [".sessions", "__pycache__", "litsearch_cache.db", ".reference", ".venv", "tests/_workspace_tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are mostly log messages
    "B008",    # Streamlit's API is function-call-in-default by design
    "SIM108",  # ternary is not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# app.py must extend sys.path before importing litsearch, so its imports
# are legitimately not at the top of the file.
"app.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
