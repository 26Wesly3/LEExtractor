[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litsearch"
version = "0.8.0"
description = "Systematic literature review toolkit (PRISMA 2020 + TARCiS) with Streamlit GUI and MCP server"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "streamlit>=1.50,<2",
    "scikit-learn>=1.3",
    "fastmcp>=3.0,<5",
    "python-dotenv>=1.0",
    "networkx>=3.0",
]

[project.scripts]
litsearch-mcp = "litsearch.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["litsearch", "litsearch.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".sessions", "__pycache__", "litsearch_cache.db", ".reference", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are mostly log messages
    "B008",    # Streamlit's API is function-call-in-default by design
    "SIM108",  # ternary is not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# app.py must extend sys.path before importing litsearch, so its imports
# are legitimately not at the top of the file.
"app.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
